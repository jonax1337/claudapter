name: test-package
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:tui
      - run: npm pack
      - name: Install and check packed artifact
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/claudapter-install"
          npm install --prefix "$RUNNER_TEMP/claudapter-install" ./claudapter-*.tgz
          node "$RUNNER_TEMP/claudapter-install/node_modules/claudapter/dist/cli.js" --version
