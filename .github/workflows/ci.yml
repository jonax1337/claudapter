name: test-package
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: Install and check packed artifact
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/claudapter-install"
          npm install --prefix "$RUNNER_TEMP/claudapter-install" ./claudapter-0.1.0-rc.1.tgz
          node "$RUNNER_TEMP/claudapter-install/node_modules/claudapter/dist/cli.js" --version
